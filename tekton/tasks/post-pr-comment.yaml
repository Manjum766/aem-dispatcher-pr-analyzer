apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: post-pr-comment
  labels:
    app.kubernetes.io/part-of: pr-review-agent
spec:
  description: >
    Reads sonar-result.json, snyk-result.json, and dispatcher-result.json from
    the shared output workspace, builds a Markdown summary, and upserts a single
    comment on the GitHub pull request. Handles missing result files gracefully.

  params:
    - name: REPO_OWNER
      description: GitHub organisation or user name.
      type: string
    - name: REPO_NAME
      description: GitHub repository name.
      type: string
    - name: PR_NUMBER
      description: Pull request number.
      type: string

  workspaces:
    - name: output
      description: Shared workspace containing the scan result JSON files.

  steps:
    - name: post-comment
      # alpine/git ships curl; jq is installed inline below.
      image: alpine:3.19
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
        - name: REPO_OWNER
          value: $(params.REPO_OWNER)
        - name: REPO_NAME
          value: $(params.REPO_NAME)
        - name: PR_NUMBER
          value: $(params.PR_NUMBER)
        - name: RESULTS_DIR
          value: $(workspaces.output.path)
      script: |
        #!/usr/bin/env sh
        set -eu

        # Install jq (curl is already in alpine)
        apk add --no-cache jq curl >/dev/null 2>&1

        # post-comment.sh is part of the repo, copied to the source workspace.
        # We embed the script inline here so the Task is self-contained and does
        # not depend on where the source workspace is mounted.

        MARKER="<!-- pr-review-agent-marker -->"
        API_BASE="https://api.github.com"
        AUTH_HEADER="Authorization: token ${GITHUB_TOKEN}"
        ACCEPT_HEADER="Accept: application/vnd.github+json"

        read_result() {
          FILE="$1"
          if [ -f "$FILE" ] && jq empty "$FILE" 2>/dev/null; then
            cat "$FILE"
          else
            printf '{"status":"did_not_complete"}'
          fi
        }

        SONAR=$(read_result "${RESULTS_DIR}/sonar-result.json")
        SNYK=$(read_result "${RESULTS_DIR}/snyk-result.json")
        DISP=$(read_result "${RESULTS_DIR}/dispatcher-result.json")

        SONAR_STATUS=$(echo "$SONAR" | jq -r '.status // "did_not_complete"')
        SONAR_BUGS=$(echo "$SONAR" | jq -r '.bugs // "?"')
        SONAR_VULNS=$(echo "$SONAR" | jq -r '.vulnerabilities // "?"')
        SONAR_SMELLS=$(echo "$SONAR" | jq -r '.code_smells // "?"')
        SONAR_URL=$(echo "$SONAR" | jq -r '.dashboard_url // ""')

        case "$SONAR_STATUS" in
          passed)   SONAR_BADGE="✅ Passed" ;;
          failed)   SONAR_BADGE="❌ Failed" ;;
          *)        SONAR_BADGE="⚠️ Scan did not complete" ;;
        esac

        if [ -n "$SONAR_URL" ] && [ "$SONAR_URL" != "null" ]; then
          SONAR_DETAIL="${SONAR_BUGS} bugs, ${SONAR_VULNS} vulns, ${SONAR_SMELLS} smells — [Dashboard](${SONAR_URL})"
        else
          SONAR_DETAIL="${SONAR_BUGS} bugs, ${SONAR_VULNS} vulns, ${SONAR_SMELLS} smells"
        fi

        SNYK_STATUS=$(echo "$SNYK" | jq -r '.status // "did_not_complete"')
        SNYK_SECRETS=$(echo "$SNYK" | jq -r '.secrets_found // "?"')
        SNYK_CRITICAL=$(echo "$SNYK" | jq -r '.critical_vulns // "?"')
        SNYK_HIGH=$(echo "$SNYK" | jq -r '.high_vulns // "?"')

        case "$SNYK_STATUS" in
          passed)   SNYK_BADGE="✅ Passed" ;;
          failed)   SNYK_BADGE="❌ Issues found" ;;
          *)        SNYK_BADGE="⚠️ Scan did not complete" ;;
        esac

        SNYK_DETAIL="${SNYK_CRITICAL} critical, ${SNYK_HIGH} high CVEs; ${SNYK_SECRETS} secrets found"

        DISP_STATUS=$(echo "$DISP" | jq -r '.status // "did_not_complete"')
        DISP_TOTAL=$(echo "$DISP" | jq -r '.total_findings // "?"')
        DISP_CRITICAL=$(echo "$DISP" | jq -r '.critical // "?"')
        DISP_HIGH=$(echo "$DISP" | jq -r '.high // "?"')

        case "$DISP_STATUS" in
          passed)   DISP_BADGE="✅ Clean" ;;
          warnings) DISP_BADGE="⚠️ Warnings" ;;
          failed)   DISP_BADGE="❌ Issues found" ;;
          *)        DISP_BADGE="⚠️ Scan did not complete" ;;
        esac

        DISP_DETAIL="${DISP_TOTAL} findings (critical=${DISP_CRITICAL} high=${DISP_HIGH})"

        SNYK_ISSUES=$(echo "$SNYK" | jq -r \
          '(.issues? // []) | if length == 0 then "No issues found."
           else map("- **[\(.severity | ascii_upcase)]** `\(.id)` — \(.title) (\(.source))") | join("\n")
           end')

        DISP_ISSUES=$(echo "$DISP" | jq -r \
          '(.findings? // []) | if length == 0 then "No issues found."
           else map("- **\(.severity)** `\(.rule)` \(.file):\(.line) — \(.message)") | join("\n")
           end')

        COMMENT_BODY="## 🤖 PR Review Agent

| Check | Status | Details |
|---|---|---|
| 🔍 SonarQube | ${SONAR_BADGE} | ${SONAR_DETAIL} |
| 🔒 Snyk | ${SNYK_BADGE} | ${SNYK_DETAIL} |
| ⚙️ Dispatcher Rules | ${DISP_BADGE} | ${DISP_DETAIL} |

<details><summary>Snyk Findings</summary>

${SNYK_ISSUES}
</details>

<details><summary>Dispatcher Findings</summary>

${DISP_ISSUES}
</details>

${MARKER}"

        EXISTING_ID=$(curl -sf \
          -H "$AUTH_HEADER" \
          -H "$ACCEPT_HEADER" \
          "${API_BASE}/repos/${REPO_OWNER}/${REPO_NAME}/issues/${PR_NUMBER}/comments?per_page=100" \
          | jq -r --arg m "$MARKER" '[.[] | select(.body | contains($m))] | first | .id // empty')

        PAYLOAD=$(jq -n --arg body "$COMMENT_BODY" '{"body":$body}')

        if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
          echo "Updating comment id=${EXISTING_ID}"
          curl -sf -X PATCH \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${API_BASE}/repos/${REPO_OWNER}/${REPO_NAME}/issues/comments/${EXISTING_ID}" > /dev/null
          echo "Done."
        else
          echo "Creating new comment"
          curl -sf -X POST \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${API_BASE}/repos/${REPO_OWNER}/${REPO_NAME}/issues/${PR_NUMBER}/comments" > /dev/null
          echo "Done."
        fi
