name: AEM Dispatcher PR Analyzer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dispatcher Analyzer
        run: |
          python .github/scripts/dispatcher_analyzer.py

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: dispatcher-report.md