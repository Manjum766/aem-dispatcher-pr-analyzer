name: AEM Dispatcher PR Analyzer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-analyzer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Dispatcher rules lint ─────────────────────────────────────────────
  dispatcher-lint:
    name: Dispatcher Rules Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dispatcher Analyzer
        run: python .github/scripts/dispatcher_analyzer.py

      - name: Upload dispatcher results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatcher-results
          path: |
            dispatcher-result.json
            dispatcher-report.md

  # ── Job 2: SonarCloud SAST scan ──────────────────────────────────────────────
  sonarcloud-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven (compile only)
        working-directory: java-demo
        run: mvn -B compile --no-transfer-progress
        continue-on-error: true

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          PR_NUM:   ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUM" ]; then
            echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          else
            NUM=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/pulls?state=open&head=$(echo $REPO | cut -d/ -f1):$(git rev-parse --abbrev-ref HEAD)&per_page=5" \
              | python3 -c "import json,sys; prs=json.load(sys.stdin); print(prs[0]['number'] if prs else '')" 2>/dev/null || echo "")
            echo "number=${NUM}" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.pullrequest.key=${{ steps.pr.outputs.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref || github.ref_name }}
            -Dsonar.pullrequest.base=${{ github.base_ref || 'master' }}

      - name: SonarCloud Quality Gate check
        id: sonarcloud-quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Write SonarCloud result JSON
        if: always()
        env:
          QG_STATUS: ${{ steps.sonarcloud-quality-gate.outputs.quality-gate-status }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          STATUS="passed"
          if [ "${QG_STATUS}" != "PASSED" ]; then STATUS="failed"; fi
          cat > sonar-result.json <<EOF
          {
            "status": "${STATUS}",
            "quality_gate_status": "${QG_STATUS:-UNKNOWN}",
            "dashboard_url": "https://sonarcloud.io/dashboard?id=${SONAR_PROJECT_KEY}&pullRequest=${PR_NUMBER}"
          }
          EOF
          cat sonar-result.json

      - name: Upload SonarCloud results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-results
          path: sonar-result.json

  # ── Job 3: Snyk SAST + dependency CVE scan ───────────────────────────────────
  snyk-scan:
    name: Snyk Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Snyk code test (SAST)
        continue-on-error: true
        run: snyk code test --sarif-file-output=snyk-code-raw.json . || true

      - name: Snyk test — Maven
        continue-on-error: true
        run: |
          if [ -f java-demo/pom.xml ]; then
            snyk test --file=java-demo/pom.xml --json-file-output=snyk-maven-raw.json || true
          else
            echo '{"vulnerabilities":[]}' > snyk-maven-raw.json
          fi

      - name: Snyk test — ui.frontend.widgets
        continue-on-error: true
        run: |
          if [ -f ui.frontend.widgets/package.json ]; then
            snyk test --file=ui.frontend.widgets/package.json --json-file-output=snyk-widgets-raw.json || true
          else
            echo '{"vulnerabilities":[]}' > snyk-widgets-raw.json
          fi

      - name: Snyk test — ui.frontend.idl
        continue-on-error: true
        run: |
          if [ -f ui.frontend.idl/package.json ]; then
            snyk test --file=ui.frontend.idl/package.json --json-file-output=snyk-idl-raw.json || true
          else
            echo '{"vulnerabilities":[]}' > snyk-idl-raw.json
          fi

      - name: Merge Snyk results
        if: always()
        run: python3 .github/scripts/merge_snyk_results.py

      - name: Upload Snyk results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-results
          path: snyk-result.json

  # ── Job 4: Post consolidated PR comment ──────────────────────────────────────
  post-comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    needs: [dispatcher-lint, sonarcloud-scan, snyk-scan]
    if: always()
    permissions:
      pull-requests: write

    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download dispatcher results
        uses: actions/download-artifact@v4
        with:
          name: dispatcher-results
        continue-on-error: true

      - name: Download SonarCloud results
        uses: actions/download-artifact@v4
        with:
          name: sonar-results
        continue-on-error: true

      - name: Download Snyk results
        uses: actions/download-artifact@v4
        with:
          name: snyk-results
        continue-on-error: true

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          PR_NUM:   ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUM" ]; then
            echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          else
            NUM=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/pulls?state=open&head=$(echo $REPO | cut -d/ -f1):$(git rev-parse --abbrev-ref HEAD)&per_page=5" \
              | python3 -c "import json,sys; prs=json.load(sys.stdin); print(prs[0]['number'] if prs else '')" 2>/dev/null || echo "")
            echo "number=${NUM}" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          PR:       ${{ steps.pr.outputs.number }}
        run: python3 .github/scripts/post_comment.py
