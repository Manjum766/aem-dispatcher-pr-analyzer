name: AEM Dispatcher PR Analyzer

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least-privilege default — each job gets only what it needs.
permissions:
  contents: read

# ── Concurrency: cancel in-flight run on same PR when a new push arrives ──────
concurrency:
  group: pr-analyzer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Dispatcher rules lint ─────────────────────────────────────────────
  dispatcher-lint:
    name: Dispatcher Rules Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout only
      statuses: write       # post explicit commit status so branch protection sees it

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dispatcher Analyzer
        run: python .github/scripts/dispatcher_analyzer.py

      - name: Upload dispatcher results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatcher-results
          path: |
            dispatcher-result.json
            dispatcher-report.md
        # The analyzer script itself exits non-zero on CRITICAL/HIGH findings,
        # so no separate fail step is needed here.

  # ── Job 2: SonarCloud SAST scan ──────────────────────────────────────────────
  sonarcloud-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write       # allows the quality-gate action to post a commit status

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required for accurate blame / new-code detection
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Maven (compile only — no tests)
        working-directory: java-demo
        run: mvn -B compile --no-transfer-progress

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}

      - name: SonarCloud Quality Gate check
        id: sonarcloud-quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        # No continue-on-error — a failed gate must fail this job and block the merge

      - name: Write SonarCloud result JSON
        if: always()
        env:
          QG_STATUS: ${{ steps.sonarcloud-quality-gate.outputs.quality-gate-status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          STATUS="passed"
          if [ "${QG_STATUS}" != "PASSED" ]; then
            STATUS="failed"
          fi
          cat > sonar-result.json <<EOF
          {
            "status": "${STATUS}",
            "quality_gate_status": "${QG_STATUS:-UNKNOWN}",
            "dashboard_url": "https://sonarcloud.io/dashboard?id=${SONAR_PROJECT_KEY}&pullRequest=${PR_NUMBER}"
          }
          EOF
          echo "Wrote sonar-result.json"
          cat sonar-result.json

      - name: Upload SonarCloud results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-results
          path: sonar-result.json

  # ── Job 3: Snyk SAST + dependency CVE scan ───────────────────────────────────
  snyk-scan:
    name: Snyk Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout only
      statuses: write       # post explicit commit status so branch protection sees it

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (required for Snyk CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      # snyk code test → SARIF output (catches Java SAST: SQL injection,
      # hardcoded secrets, weak crypto, NPE, etc.)
      - name: Snyk code test — SAST (Java + all sources)
        id: snyk-code
        continue-on-error: true
        run: snyk code test --sarif-file-output=snyk-code-raw.json . || true

      # snyk test → dependency CVE scan (jackson-databind 2.9.8,
      # commons-collections4 4.0, spring-web 5.2.0 all have known CVEs)
      - name: Snyk test — Maven dependency CVEs
        id: snyk-maven
        continue-on-error: true
        run: |
          if [ -f java-demo/pom.xml ]; then
            snyk test --file=java-demo/pom.xml --json-file-output=snyk-maven-raw.json || true
          else
            echo '{"vulnerabilities":[]}' > snyk-maven-raw.json
          fi

      - name: Snyk test — ui.frontend.widgets (Yarn)
        id: snyk-widgets
        continue-on-error: true
        run: |
          if [ -f ui.frontend.widgets/package.json ]; then
            snyk test --file=ui.frontend.widgets/package.json --json-file-output=snyk-widgets-raw.json || true
          else
            echo '{"vulnerabilities":[]}' > snyk-widgets-raw.json
          fi

      - name: Snyk test — ui.frontend.idl (npm)
        id: snyk-idl
        continue-on-error: true
        run: |
          if [ -f ui.frontend.idl/package.json ]; then
            snyk test --file=ui.frontend.idl/package.json --json-file-output=snyk-idl-raw.json || true
          else
            echo '{"vulnerabilities":[]}' > snyk-idl-raw.json
          fi

      - name: Merge Snyk results
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, sys

          def load(path):
              try:
                  text = pathlib.Path(path).read_text()
                  data = json.loads(text)
                  if isinstance(data, list):
                      return data[0] if data else {}
                  return data
              except Exception:
                  return {}

          code    = load("snyk-code-raw.json")   # SARIF from snyk code test
          maven   = load("snyk-maven-raw.json")  # JSON from snyk test
          widgets = load("snyk-widgets-raw.json")
          idl     = load("snyk-idl-raw.json")

          # ── Parse SARIF (snyk code output) ────────────────────────────────
          # SARIF uses level: "error" | "warning" | "note" — not critical/high/medium/low.
          # Map them: error→high, warning→medium, note→low.
          SARIF_LEVEL_MAP = {"error": "high", "warning": "medium", "note": "low", "none": "low"}

          def sarif_results(data):
              """Flatten all results from a SARIF document."""
              return [r for run in data.get("runs", []) for r in run.get("results", [])]

          def sarif_severity(result):
              raw = (result.get("level") or "warning").lower()
              return SARIF_LEVEL_MAP.get(raw, "medium")

          def sarif_location(result):
              """Return 'file:line' string or empty string."""
              try:
                  loc = result["locations"][0]["physicalLocation"]
                  path = loc["artifactLocation"]["uri"]
                  line = loc.get("region", {}).get("startLine", 0)
                  return f"{path}:{line}" if line else path
              except (KeyError, IndexError):
                  return ""

          def sarif_issues(data, source):
              issues = []
              for r in sarif_results(data):
                  sev = sarif_severity(r)
                  issues.append({
                      "id":       r.get("ruleId") or "unknown",
                      "title":    (r.get("message") or {}).get("text") or "No title",
                      "severity": sev,
                      "source":   source,
                      "location": sarif_location(r),
                  })
              return issues

          # ── Parse snyk test JSON (dependency CVEs) ────────────────────────
          def dep_vulns(data):
              return data.get("vulnerabilities", [])

          def count_sev(vulns, sev):
              return sum(1 for v in vulns if v.get("severity", "").lower() == sev)

          def dep_issues(data, source):
              return [
                  {
                      "id":       v.get("id") or "unknown",
                      "title":    v.get("title") or v.get("packageName") or "No title",
                      "severity": v.get("severity", "unknown").lower(),
                      "source":   source,
                      "location": f"{v.get('packageName', '')}@{v.get('version', '')}",
                  }
                  for v in dep_vulns(data)[:20]
              ]

          # ── Count SAST issues from snyk code ──────────────────────────────
          sarif_all    = sarif_results(code)
          code_high    = sum(1 for r in sarif_all if sarif_severity(r) == "high")
          code_medium  = sum(1 for r in sarif_all if sarif_severity(r) == "medium")
          code_low     = sum(1 for r in sarif_all if sarif_severity(r) == "low")

          # Secrets: ruleId contains keywords like HardcodedSecret, Credentials, etc.
          SECRET_RULE_KEYWORDS = ("secret", "credential", "password", "hardcoded", "token", "apikey")
          code_secrets = sum(
              1 for r in sarif_all
              if any(kw in (r.get("ruleId") or "").lower() for kw in SECRET_RULE_KEYWORDS)
          )

          # ── Count dependency CVEs ─────────────────────────────────────────
          mvn_vulns  = dep_vulns(maven)
          wid_vulns  = dep_vulns(widgets)
          idl_vulns  = dep_vulns(idl)
          all_dep    = mvn_vulns + wid_vulns + idl_vulns

          dep_critical = count_sev(all_dep, "critical")
          dep_high     = count_sev(all_dep, "high")
          dep_medium   = count_sev(all_dep, "medium")
          dep_low      = count_sev(all_dep, "low")

          # ── Totals ────────────────────────────────────────────────────────
          total_high   = code_high   + dep_critical + dep_high
          total_medium = code_medium + dep_medium
          total_low    = code_low    + dep_low
          total_secrets = code_secrets

          all_issues = (
              sarif_issues(code, "java-sast")
            + dep_issues(maven,   "maven-deps")
            + dep_issues(widgets, "ui.frontend.widgets")
            + dep_issues(idl,     "ui.frontend.idl")
          )

          failed = total_secrets > 0 or dep_critical > 0 or total_high > 0
          status = "failed" if failed else "passed"

          result = {
              "status":          status,
              "secrets_found":   total_secrets,
              "sast_high":       code_high,
              "sast_medium":     code_medium,
              "critical_vulns":  dep_critical,
              "high_vulns":      dep_high,
              "medium_vulns":    dep_medium,
              "low_vulns":       dep_low,
              "issues":          all_issues[:30],
          }
          pathlib.Path("snyk-result.json").write_text(json.dumps(result, indent=2))
          print("Wrote snyk-result.json")
          print(json.dumps(result, indent=2))

          if failed:
              print("::error::Snyk found vulnerabilities or secrets — merge blocked.")
              sys.exit(1)
          PYEOF

      - name: Upload Snyk results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-results
          path: snyk-result.json

  # ── Job 4: Post consolidated PR comment ─────────────────────────────────────
  post-comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    needs: [dispatcher-lint, sonarcloud-scan, snyk-scan]
    if: always()   # run even when upstream jobs fail
    permissions:
      pull-requests: write  # upsert the PR comment

    steps:
      - name: Download dispatcher results
        uses: actions/download-artifact@v4
        with:
          name: dispatcher-results
        continue-on-error: true

      - name: Download SonarCloud results
        uses: actions/download-artifact@v4
        with:
          name: sonar-results
        continue-on-error: true

      - name: Download Snyk results
        uses: actions/download-artifact@v4
        with:
          name: snyk-results
        continue-on-error: true

      - name: Build and upsert PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          PR:       ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, textwrap, urllib.request, urllib.error

          MARKER = "<!-- pr-review-agent-marker -->"
          TOKEN  = os.environ["GH_TOKEN"]
          REPO   = os.environ["REPO"]
          PR     = os.environ["PR"]
          API    = "https://api.github.com"

          HEADERS = {
              "Authorization": f"token {TOKEN}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def gh(method, path, body=None):
              data = json.dumps(body).encode() if body else None
              req  = urllib.request.Request(f"{API}{path}", data=data, headers=HEADERS, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print(f"GitHub API {method} {path} -> {e.code}: {e.read().decode()}")
                  return {}

          def load(path):
              try:
                  return json.loads(open(path).read())
              except Exception:
                  return {"status": "did_not_complete"}

          sonar = load("sonar-result.json")
          snyk  = load("snyk-result.json")
          disp  = load("dispatcher-result.json")

          # ════════════════════════════════════════════════════════════════════
          # AI AGENT FIX RECOMMENDATION DATABASES
          # ════════════════════════════════════════════════════════════════════

          # ── Snyk SAST fix DB (keyed on ruleId substring, case-insensitive) ─
          # Each entry: (one-line summary, code fix block)
          SNYK_SAST_FIX = {
              "hardcodedpassword": (
                  "Remove the hardcoded credential. Read it from environment variables or a secrets manager.",
                  """\
```java
// ❌ Before
private static final String PASSWORD = "admin123";

// ✅ After — read from environment / secrets manager
private static final String PASSWORD = System.getenv("APP_PASSWORD");
// Or with a framework: @Value("${app.password}") private String password;
```""",
              ),
              "hardcredsecret": (
                  "Remove the hardcoded credential. Read it from environment variables or a secrets manager.",
                  """\
```java
// ✅ After — read from environment / secrets manager
private static final String SECRET = System.getenv("APP_SECRET");
```""",
              ),
              "sqli": (
                  "Use PreparedStatement with parameter binding — never concatenate user input into SQL.",
                  """\
```java
// ❌ Before
String query = "SELECT * FROM users WHERE username='" + username + "'";
stmt.executeQuery(query);

// ✅ After
PreparedStatement ps = connection.prepareStatement(
    "SELECT * FROM users WHERE username = ?");
ps.setString(1, username);
ResultSet rs = ps.executeQuery();
```""",
              ),
              "sqlinjection": (
                  "Use PreparedStatement with parameter binding — never concatenate user input into SQL.",
                  """\
```java
// ❌ Before
String query = "SELECT * FROM users WHERE username='" + username + "'";

// ✅ After
PreparedStatement ps = connection.prepareStatement(
    "SELECT * FROM users WHERE username = ?");
ps.setString(1, username);
```""",
              ),
              "weakrandom": (
                  "Replace java.util.Random with java.security.SecureRandom for any security-sensitive value.",
                  """\
```java
// ❌ Before
Random random = new Random();
int otp = 100000 + random.nextInt(900000);

// ✅ After
SecureRandom secureRandom = new SecureRandom();
int otp = 100000 + secureRandom.nextInt(900000);
```""",
              ),
              "insecurerandom": (
                  "Replace java.util.Random with java.security.SecureRandom for security-sensitive values.",
                  """\
```java
// ✅ After
import java.security.SecureRandom;
SecureRandom sr = new SecureRandom();
```""",
              ),
              "nullpointer": (
                  "Add a null-check or use Objects.requireNonNull() before dereferencing the parameter.",
                  """\
```java
// ❌ Before
public int getLength(String value) {
    return value.length(); // NPE if value is null
}

// ✅ After
public int getLength(String value) {
    if (value == null) return 0;
    return value.length();
}
// Or with Optional:
// return Optional.ofNullable(value).map(String::length).orElse(0);
```""",
              ),
              "xss": (
                  "Encode all user-controlled output before writing to HTML. Use a library like OWASP Java Encoder.",
                  """\
```java
// ✅ After — using OWASP Java Encoder
import org.owasp.encoder.Encode;
String safe = Encode.forHtml(userInput);
```""",
              ),
              "pathtraversal": (
                  "Canonicalize and validate file paths to prevent directory traversal attacks.",
                  """\
```java
// ✅ After
Path base    = Paths.get("/allowed/base").toRealPath();
Path target  = base.resolve(userInput).normalize();
if (!target.startsWith(base)) {
    throw new SecurityException("Path traversal attempt blocked");
}
```""",
              ),
              "deserializ": (
                  "Avoid Java native deserialization of untrusted data. Use a safe format (JSON/Protobuf) or an object filter.",
                  """\
```java
// ✅ After — use ObjectInputFilter (Java 9+)
ObjectInputStream ois = new ObjectInputStream(inputStream);
ois.setObjectInputFilter(ObjectInputFilter.Config.createFilter(
    "com.example.SafeClass;!*"));
```""",
              ),
          }

          # Generic fix advice for Snyk SAST rules not matched above
          SNYK_SAST_GENERIC = (
              "Review the flagged code and apply the principle of least privilege / input validation.",
              "> Refer to the [Snyk vulnerability database](https://security.snyk.io) for rule-specific remediation guidance.",
          )

          # ── Snyk dependency CVE fix DB (keyed on package name substring) ──
          # Each entry: (upgrade instruction, notes)
          SNYK_DEP_FIX = {
              "jackson-databind": (
                  "Upgrade `jackson-databind` to **2.15.4** or later (2.14.x minimum for Java 11).",
                  """\
```xml
<!-- ✅ pom.xml -->
<dependency>
  <groupId>com.fasterxml.jackson.core</groupId>
  <artifactId>jackson-databind</artifactId>
  <version>2.15.4</version>
</dependency>
```""",
              ),
              "commons-collections": (
                  "Upgrade `commons-collections4` to **4.4** or later.",
                  """\
```xml
<!-- ✅ pom.xml -->
<dependency>
  <groupId>org.apache.commons</groupId>
  <artifactId>commons-collections4</artifactId>
  <version>4.4</version>
</dependency>
```""",
              ),
              "spring-web": (
                  "Upgrade `spring-web` to **5.3.39** or later (or **6.x** for Java 17+).",
                  """\
```xml
<!-- ✅ pom.xml -->
<dependency>
  <groupId>org.springframework</groupId>
  <artifactId>spring-web</artifactId>
  <version>5.3.39</version>
</dependency>
```""",
              ),
              "spring-webmvc": (
                  "Upgrade `spring-webmvc` to **5.3.39** or later.",
                  """\
```xml
<!-- ✅ pom.xml -->
<dependency>
  <groupId>org.springframework</groupId>
  <artifactId>spring-webmvc</artifactId>
  <version>5.3.39</version>
</dependency>
```""",
              ),
          }

          SNYK_DEP_GENERIC = (
              "Upgrade the dependency to the latest stable version that resolves the CVE.",
              "> Check [Snyk Advisor](https://snyk.io/advisor) or [MVN Repository](https://mvnrepository.com) for the recommended safe version.",
          )

          # ── Dispatcher rule fix DB (keyed on DISP-XXX rule code) ──────────
          DISP_FIX = {
              "DISP-001": (
                  'Remove the `/glob "*" /type "allow"` catch-all and replace with explicit allow rules.',
                  """\
```apache
# ❌ Before
/0001 { /glob "*" /type "allow" }

# ✅ After — deny everything first, then allow only what is needed
/0001 { /glob "*"          /type "deny"  }
/0002 { /glob "/content/*" /type "allow" }
/0003 { /glob "/etc/designs/*" /type "allow" }
/0004 { /glob "/clientlibs/*"  /type "allow" }
```""",
              ),
              "DISP-002": (
                  'Make the very first `/type` rule in the filter file a `/type "deny"` to enforce an allow-list.',
                  """\
```apache
# ✅ Add as rule /0001 (before any allow rules)
/0001 { /type "deny" /url "*" }
```""",
              ),
              "DISP-003": (
                  'Remove any rule that allows `/crx/*` or `/system/*`. These paths must never be reachable via the dispatcher.',
                  """\
```apache
# ❌ Remove these rules entirely
# /0010 { /glob "/crx/*"    /type "allow" }
# /0011 { /glob "/system/*" /type "allow" }

# ✅ Explicitly deny them (belt-and-suspenders)
/0010 { /glob "/crx/*"    /type "deny" }
/0011 { /glob "/system/*" /type "deny" }
```""",
              ),
              "DISP-004": (
                  'Add a specific deny rule for sensitive `/bin/` servlets after the broad allow, or remove the allow entirely.',
                  """\
```apache
# If you must allow specific bin servlets, be explicit:
/0020 { /glob "/bin/public/*" /type "allow" }

# ✅ Then deny everything else under /bin
/0021 { /glob "/bin/*"        /type "deny"  }
```""",
              ),
              "DISP-005": (
                  'The cache rules must deny sensitive paths. Add explicit deny overrides after the allow-all.',
                  """\
```apache
# ✅ cache.any — deny admin paths before the catch-all allow
/rules {
  /0001 { /glob "/crx/*"    /type "deny" }
  /0002 { /glob "/system/*" /type "deny" }
  /0003 { /glob "/bin/*"    /type "deny" }
  /0004 { /glob "/libs/*"   /type "deny" }
  /0005 { /glob "/conf/*"   /type "deny" }
  /0006 { /glob "*"         /type "allow" }
}
```""",
              ),
              "DISP-005b": (
                  "Explicitly ignore known tracking/analytics query parameters so they do not fragment the cache.",
                  """\
```apache
# ✅ ignoreUrlParams — list params that should NOT affect the cache key
/ignoreUrlParams {
  /0001 { /glob "utm_*"   /type "allow" }
  /0002 { /glob "gclid"   /type "allow" }
  /0003 { /glob "fbclid"  /type "allow" }
  /0004 { /glob "_ga"     /type "allow" }
  # Everything else DOES affect the cache key (deny = include in key)
  /0005 { /glob "*"       /type "deny"  }
}
```""",
              ),
              "DISP-006": (
                  "Add a `Content-Security-Policy` response header to the VHost file.",
                  """\
```apache
# ✅ Add inside <VirtualHost> block
Header always set Content-Security-Policy \\
  "default-src 'self'; script-src 'self' 'nonce-{NONCE}'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none';"
```""",
              ),
              "DISP-007": (
                  "Add an `X-Frame-Options` response header to prevent clickjacking.",
                  """\
```apache
# ✅ Add inside <VirtualHost> block
Header always set X-Frame-Options "SAMEORIGIN"
```""",
              ),
              "DISP-008": (
                  'Set `/allowAuthorized "0"` (the default) to prevent caching of authenticated responses.',
                  """\
```apache
# ❌ Before
/allowAuthorized "1"

# ✅ After
/allowAuthorized "0"
# Or remove the line entirely — "0" is the default.
```""",
              ),
              "DISP-009": (
                  "Remove the rule that caches this sensitive AEM path. It must never be cached or publicly accessible.",
                  """\
```apache
# ❌ Remove these lines from /rules { }
# /0004 { /glob "/crx/*"    /type "allow" }
# /0005 { /glob "/system/*" /type "allow" }

# ✅ Replace with explicit deny (belt-and-suspenders)
/0004 { /glob "/crx/*"    /type "deny" }
/0005 { /glob "/system/*" /type "deny" }
```""",
              ),
              "DISP-010": (
                  "Remove `/libs/*` and `/conf/*` from cache allow rules — these are AEM internal paths.",
                  """\
```apache
# ❌ Remove
# /0006 { /glob "/libs/*" /type "allow" }
# /0007 { /glob "/conf/*" /type "allow" }

# ✅ Add explicit deny
/0006 { /glob "/libs/*" /type "deny" }
/0007 { /glob "/conf/*" /type "deny" }
```""",
              ),
              "DISP-GQL": (
                  "Restrict the GraphQL endpoint to persisted queries only and ensure it is not publicly cacheable.",
                  """\
```apache
# ✅ In your VHost — block ad-hoc GraphQL queries (POST with query= param)
<LocationMatch "/_cq_graphql">
  # Only allow GET requests (persisted queries)
  <LimitExcept GET>
    Require all denied
  </LimitExcept>
</LocationMatch>
```""",
              ),
          }

          # ════════════════════════════════════════════════════════════════════
          # LOOKUP HELPERS
          # ════════════════════════════════════════════════════════════════════

          def snyk_sast_fix(rule_id):
              rid = (rule_id or "").lower()
              for key, val in SNYK_SAST_FIX.items():
                  if key in rid:
                      return val
              return SNYK_SAST_GENERIC

          def snyk_dep_fix(location):
              loc = (location or "").lower()
              for key, val in SNYK_DEP_FIX.items():
                  if key in loc:
                      return val
              return SNYK_DEP_GENERIC

          def disp_fix(rule):
              return DISP_FIX.get(rule, (
                  "Review the dispatcher configuration and apply the principle of least privilege.",
                  "> Consult the [AEM Dispatcher Security Checklist](https://experienceleague.adobe.com/docs/experience-manager-dispatcher/using/getting-started/security-checklist.html) for remediation guidance.",
              ))

          # ════════════════════════════════════════════════════════════════════
          # SUMMARY TABLE ROWS
          # ════════════════════════════════════════════════════════════════════

          SEV_ICON  = {"high": "🔴", "critical": "🔴", "medium": "🟠", "low": "🟡"}
          DISP_ICON = {"CRITICAL": "🔴", "HIGH": "🟠", "MEDIUM": "🟡", "LOW": "🔵"}

          sonar_status = sonar.get("status", "did_not_complete")
          sonar_badge  = {"passed": "✅ Passed", "failed": "❌ Failed"}.get(sonar_status, "⚠️ Scan did not complete")
          sonar_url    = sonar.get("dashboard_url", "")
          sonar_link   = f" — [Dashboard]({sonar_url})" if sonar_url else ""
          sonar_detail = f"QG: {sonar.get('quality_gate_status', '?')}{sonar_link}"

          snyk_status  = snyk.get("status", "did_not_complete")
          snyk_badge   = {"passed": "✅ Passed", "failed": "❌ Issues found"}.get(snyk_status, "⚠️ Scan did not complete")
          snyk_detail  = (
              f"SAST: {snyk.get('sast_high','?')} high, {snyk.get('sast_medium','?')} medium · "
              f"CVEs: {snyk.get('critical_vulns','?')} critical, {snyk.get('high_vulns','?')} high · "
              f"Secrets: {snyk.get('secrets_found','?')}"
          )

          disp_status  = disp.get("status", "did_not_complete")
          disp_badge   = {"passed": "✅ Clean", "warnings": "⚠️ Warnings", "failed": "❌ Issues found"}.get(disp_status, "⚠️ Scan did not complete")
          disp_detail  = (
              f"{disp.get('total_findings','?')} findings · "
              f"{disp.get('critical','?')} critical, {disp.get('high','?')} high · "
              f"score: {disp.get('score','?')}/100"
          )

          # ════════════════════════════════════════════════════════════════════
          # AI AGENT SUMMARY BLOCK
          # ════════════════════════════════════════════════════════════════════

          any_failed = any(s == "failed" for s in [sonar_status, snyk_status, disp_status])
          if any_failed:
              action_items = []
              if disp_status == "failed":
                  action_items.append(
                      f"- **Dispatcher** — fix {disp.get('critical',0)} critical and "
                      f"{disp.get('high',0)} high rule violations in your `.any` / `.vhost` files "
                      f"before this can be merged (see findings below)"
                  )
              if snyk_status == "failed":
                  if snyk.get("secrets_found", 0) > 0:
                      action_items.append(
                          "- **Secrets** — remove hardcoded credentials from source code immediately; "
                          "rotate any exposed values and store them in environment variables or a secrets manager"
                      )
                  if (snyk.get("sast_high", 0) or 0) > 0:
                      action_items.append(
                          f"- **SAST** — {snyk.get('sast_high',0)} high-severity code issues detected "
                          f"(SQL injection, weak crypto, etc.) — see fix recommendations below"
                      )
                  if (snyk.get("critical_vulns", 0) or 0) + (snyk.get("high_vulns", 0) or 0) > 0:
                      action_items.append(
                          f"- **Dependencies** — {snyk.get('critical_vulns',0)} critical and "
                          f"{snyk.get('high_vulns',0)} high CVEs in Maven dependencies — upgrade to patched versions (see below)"
                      )
              if sonar_status == "failed":
                  action_items.append(
                      "- **SonarCloud** — Quality Gate failed; open the dashboard link above, "
                      "resolve all new bugs / vulnerabilities / hotspots on this branch"
                  )
              agent_summary = (
                  "> [!CAUTION]\n"
                  "> **🤖 AI Agent — Action Required before merge:**\n>\n"
                  + "\n".join(f"> {a}" for a in action_items)
              )
          else:
              agent_summary = (
                  "> [!NOTE]\n"
                  "> **🤖 AI Agent** — All scans passed. This PR is clear to merge from a security standpoint."
              )

          # ════════════════════════════════════════════════════════════════════
          # SNYK FINDINGS BLOCK  (finding + fix recommendation per item)
          # ════════════════════════════════════════════════════════════════════

          snyk_issues = snyk.get("issues", [])
          if snyk_issues:
              sast = [i for i in snyk_issues if i.get("source") == "java-sast"]
              deps = [i for i in snyk_issues if i.get("source") != "java-sast"]
              parts = []

              if sast:
                  parts.append("### SAST findings (Java source code)\n")
                  for i in sast:
                      loc         = f" `{i['location']}`" if i.get("location") else ""
                      fix_summary, fix_code = snyk_sast_fix(i.get("id", ""))
                      parts.append(
                          f"{SEV_ICON.get(i['severity'],'⚪')} **[{i['severity'].upper()}]** "
                          f"`{i['id']}` —{loc} {i['title']}\n\n"
                          f"> 💡 **Fix:** {fix_summary}\n\n"
                          f"{fix_code}\n"
                      )

              if deps:
                  parts.append("### Dependency CVEs\n")
                  seen_pkg = set()
                  for i in deps:
                      pkg  = i.get("location", "")
                      loc  = f" `{pkg}`" if pkg else ""
                      # de-duplicate fix advice per package (many CVEs per package)
                      pkg_key = pkg.split("@")[0] if pkg else i.get("id","")
                      fix_summary, fix_code = snyk_dep_fix(pkg)
                      parts.append(
                          f"{SEV_ICON.get(i['severity'],'⚪')} **[{i['severity'].upper()}]** "
                          f"`{i['id']}` —{loc} {i['title']}\n"
                      )
                      if pkg_key not in seen_pkg:
                          seen_pkg.add(pkg_key)
                          parts.append(
                              f"> 💡 **Fix:** {fix_summary}\n\n"
                              f"{fix_code}\n"
                          )

              snyk_rows = "\n".join(parts)
          else:
              snyk_rows = "✅ No issues found."

          # ════════════════════════════════════════════════════════════════════
          # DISPATCHER FINDINGS BLOCK  (finding + fix recommendation per rule)
          # ════════════════════════════════════════════════════════════════════

          disp_findings = disp.get("findings", [])
          if disp_findings:
              disp_parts = []
              seen_rules = set()
              for f in disp_findings:
                  rule        = f.get("rule", "")
                  loc         = f":{f['line']}" if f.get("line") else ""
                  fix_summary, fix_code = disp_fix(rule)
                  disp_parts.append(
                      f"{DISP_ICON.get(f['severity'],'⚪')} **[{f['severity']}]** "
                      f"`{rule}` `{f['file']}`{loc} — **{f['title']}**\n\n"
                      f"> ℹ️ {f.get('details','')}\n\n"
                      f"> 💡 **Fix:** {fix_summary}\n\n"
                      + (fix_code if rule not in seen_rules else
                         "> *(fix snippet shown above for this rule)*")
                      + "\n"
                  )
                  seen_rules.add(rule)
              disp_rows = "\n---\n".join(disp_parts)
          else:
              disp_rows = "✅ No issues found."

          # ════════════════════════════════════════════════════════════════════
          # ASSEMBLE COMMENT BODY
          # ════════════════════════════════════════════════════════════════════

          body = f"""## 🤖 PR Review Agent

          {agent_summary}

          | Check | Status | Details |
          |---|---|---|
          | 🔍 SonarCloud | {sonar_badge} | {sonar_detail} |
          | 🔒 Snyk | {snyk_badge} | {snyk_detail} |
          | ⚙️ Dispatcher Rules | {disp_badge} | {disp_detail} |

          <details><summary>🔒 Snyk Findings &amp; Fix Recommendations</summary>

          {snyk_rows}
          </details>

          <details><summary>⚙️ Dispatcher Findings &amp; Fix Recommendations</summary>

          {disp_rows}
          </details>

          {MARKER}"""

          body = textwrap.dedent(body).strip()

          comments = gh("GET", f"/repos/{REPO}/issues/{PR}/comments?per_page=100")
          existing = next((c for c in (comments if isinstance(comments, list) else []) if MARKER in c.get("body", "")), None)

          if existing:
              print(f"Updating comment {existing['id']}")
              gh("PATCH", f"/repos/{REPO}/issues/comments/{existing['id']}", {"body": body})
          else:
              print("Creating new comment")
              gh("POST", f"/repos/{REPO}/issues/{PR}/comments", {"body": body})

          print("Done.")
          PYEOF
