# SonarCloud scanner configuration.
# sonar.projectKey and sonar.organization must match your SonarCloud project.
# Set SONAR_TOKEN as a GitHub Actions secret and SONAR_PROJECT_KEY as a variable.

sonar.projectKey=aem-dispatcher-pr-analyzer
sonar.organization=aem-dispatcher-pr-analyzer
sonar.projectName=AEM Dispatcher PR Analyzer
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# New code reference — diff against master, not a previous scan snapshot
sonar.newCode.referenceBranch=master

# Disable automatic analysis by the SonarCloud GitHub App so it does not
# post its own "SonarCloud Code Analysis" check independently of this workflow
sonar.autoconfig.enabled=false

# ── Java (java-demo module) ───────────────────────────────────────────────────
sonar.java.source=17
sonar.sources=java-demo/src/main/java
sonar.java.binaries=java-demo/target/classes

# Exclusions: generated code and build artefacts
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/.yarn/**,\
  **/coverage/**,\
  **/*.min.js
