# SonarCloud scanner configuration for the AEM multi-module project.
# This file is auto-discovered by sonar-scanner-cli when run at repo root.
#
# sonar.projectKey and sonar.organization must match what you created on
# https://sonarcloud.io — set SONAR_PROJECT_KEY as a GitHub Actions variable
# and SONAR_TOKEN as a secret.

sonar.projectKey=aem-dispatcher-pr-analyzer
sonar.organization=aem-dispatcher-pr-analyzer
sonar.projectName=AEM Dispatcher PR Analyzer
sonar.projectVersion=1.0

# Source encoding
sonar.sourceEncoding=UTF-8

# ── Java (java-demo module) ───────────────────────────────────────────────────
sonar.java.source=11
sonar.java.binaries=java-demo/target/classes
sonar.java.libraries=java-demo/target/dependency/*.jar

# Sources to scan
sonar.sources=java-demo/src/main/java

# Exclude test sources from the main analysis; they are reported separately.
sonar.tests=java-demo/src/test/java
sonar.test.inclusions=**/*Test.java

# Exclusions: generated code, build artefacts
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/.yarn/**,\
  **/coverage/**,\
  **/*.min.js

# ── Coverage (generated by Maven Surefire + JaCoCo) ──────────────────────────
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=java-demo/target/site/jacoco/jacoco.xml
