# SonarQube scanner configuration for the AEM multi-module project.
# This file is auto-discovered by sonar-scanner-cli when run at repo root.

sonar.projectKey=${SONAR_PROJECT_KEY}
sonar.projectName=AEM Dispatcher PR Analyzer
sonar.projectVersion=1.0

# Source encoding
sonar.sourceEncoding=UTF-8

# ── Java (core module) ────────────────────────────────────────────────────────
sonar.java.source=11
sonar.java.binaries=core/target/classes
sonar.java.libraries=core/target/dependency/*.jar

# ── TypeScript / JavaScript (ui.frontend modules) ─────────────────────────────
# Both frontend modules are included as separate source directories.
sonar.sources=core/src/main/java,ui.frontend.idl/js,ui.frontend.widgets/src

# Exclude test sources from the main analysis; they are reported separately.
sonar.tests=core/src/test/java
sonar.test.inclusions=**/*Test.java,**/*Spec.ts,**/*.spec.ts,**/*.test.ts

# Exclusions: generated code, build artefacts, node_modules
sonar.exclusions=\
  **/node_modules/**,\
  **/target/**,\
  **/dist/**,\
  **/.yarn/**,\
  **/coverage/**,\
  **/*.min.js

# ── Coverage reports (generated by Maven Surefire + Jest) ─────────────────────
sonar.javascript.lcov.reportPaths=\
  ui.frontend.idl/coverage/lcov.info,\
  ui.frontend.widgets/coverage/lcov.info

sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=core/target/site/jacoco/jacoco.xml
